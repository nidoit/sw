<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maya Chronos</title>
  <style>
    :root {
      --amber: #f59e0b;
      --amber-dim: rgba(253, 230, 138, 0.7);
      --gold: #a37c35;
      --panel: rgba(15, 12, 10, 0.85);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; color: var(--amber-dim);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; }
    #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 24px; }
    .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 900; letter-spacing: .12em;
      color: var(--amber); font-size: clamp(28px, 5vw, 52px); text-shadow: 0 4px 6px rgba(0,0,0,.9); }
    .sub { margin: 4px 0 14px; text-transform: uppercase; letter-spacing: .2em; font-size: clamp(11px, 1.4vw, 16px); }
    .readout { display: grid; grid-template-columns: auto auto; gap: 4px 14px; font-size: 13px;
      background: var(--panel); border: 1px solid rgba(163,124,53,.5); border-radius: 8px; padding: 10px 14px;
      width: max-content; backdrop-filter: blur(6px); }
    .readout dt { color: rgba(253,230,138,.55); text-transform: uppercase; letter-spacing: .12em; font-size: 10px; align-self: center; }
    .readout dd { margin: 0; color: #fde68a; font-family: Georgia, serif; font-size: 16px; }
    .clock-wrap { display: flex; flex-direction: column; align-items: flex-end; }
    .badge { background: rgba(0,0,0,.8); border: 1px solid rgba(120,53,15,.5); border-radius: 4px; padding: 3px 10px;
      margin-bottom: 8px; font-size: 10px; letter-spacing: .2em; font-weight: 700; color: rgba(251,191,36,.8); }
    #maya-ui-clock { width: 120px; height: 240px; background: var(--panel); border: 2px solid var(--gold);
      border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.8), inset 0 0 15px rgba(163,124,53,.2); backdrop-filter: blur(8px); }
    .bottom { display: flex; justify-content: center; padding-bottom: 8px; }
    #toggle-cam-btn { pointer-events: auto; cursor: pointer; padding: 16px 40px; border-radius: 999px;
      background: linear-gradient(#292524, #1c1917); border: 2px solid rgba(217,119,6,.6); color: var(--amber);
      font-weight: 700; letter-spacing: .15em; text-transform: uppercase; font-size: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.6); transition: transform .3s, box-shadow .3s, color .3s; }
    #toggle-cam-btn:hover { transform: scale(1.05); color: #fcd34d; box-shadow: 0 0 20px rgba(217,119,6,.4); }
    .lang-btn { pointer-events: auto; cursor: pointer; margin-bottom: 8px; padding: 4px 12px; border-radius: 999px;
      background: rgba(0,0,0,.7); border: 1px solid rgba(217,119,6,.6); color: var(--amber); font-size: 12px;
      font-weight: 700; letter-spacing: .1em; }
    .lang-btn:hover { color: #fcd34d; }
    #error { display: none; position: fixed; inset: auto 16px 100px; padding: 12px 16px; border-radius: 8px;
      background: #3b0d0d; color: #fecaca; font-size: 14px; }
    @media (max-width: 600px) {
      #ui { padding: 14px; }
      #maya-ui-clock { width: 72px; height: 144px; }
      #toggle-cam-btn { padding: 12px 22px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="ui">
    <div class="top">
      <div>
        <h1>MAYA CHRONOS</h1>
        <p class="sub" data-i18n="sub">Tzolk'in • Haab' • Time</p>
        <dl class="readout">
          <dt data-i18n="lc">Long Count</dt><dd id="lc">–</dd>
          <dt data-i18n="tz">Tzolk'in</dt><dd id="tz">–</dd>
          <dt data-i18n="haab">Haab'</dt><dd id="haab">–</dd>
          <dt data-i18n="time">Time</dt><dd id="clock">–</dd>
        </dl>
      </div>
      <div class="clock-wrap">
        <button id="lang-btn" class="lang-btn" type="button" title="한국어 / English">한국어</button>
        <div class="badge" data-i18n="badge">REAL-TIME</div>
        <canvas id="maya-ui-clock"></canvas>
      </div>
    </div>
    <div class="bottom">
      <button id="toggle-cam-btn"><span data-i18n="zoomIn">Read The Gate (Zoom In)</span></button>
    </div>
  </div>
  <div id="error"></div>

  <script type="module">
    // ?v= is rewritten by code/build.sh on every build so browsers never pair a new .js with a cached old .wasm.
    import init, { set_labels } from './pkg/maya_chronos.js?v=3015058941';
    const WASM_URL = new URL('./pkg/maya_chronos_bg.wasm?v=3015058941', import.meta.url);

    const TEXT = {
      en: {
        sub: "Tzolk'in • Haab' • Time", lc: 'Long Count', tz: "Tzolk'in", haab: "Haab'", time: 'Time',
        badge: 'REAL-TIME', zoomIn: 'Read The Gate (Zoom In)', zoomOut: 'View Entire Mechanism (Zoom Out)',
        date3d: 'DATE', time3d: 'TIME', other: '한국어',
        fail: 'Failed to start: ',
        stale: 'pkg/maya_chronos_bg.wasm is the raw cargo output, not the wasm-bindgen output. '
          + 'Rebuild with code/build.sh and upload both files in pkg/ together.',
      },
      ko: {
        sub: '촐킨 • 하브 • 시각', lc: '장기력', tz: '촐킨', haab: '하브', time: '시각',
        badge: '실시간', zoomIn: '게이트 읽기 (확대)', zoomOut: '전체 기계 보기 (축소)',
        date3d: '날짜', time3d: '시각', other: 'English',
        fail: '시작 실패: ',
        stale: 'pkg/maya_chronos_bg.wasm이 wasm-bindgen을 거치지 않은 cargo 원본입니다. '
          + 'code/build.sh로 다시 빌드한 뒤 pkg/ 안의 두 파일을 함께 올려 주세요.',
      },
    };
    const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                    set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };
    let lang = store.get('lang');
    if (!TEXT[lang]) lang = (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
    let started = false;

    function applyLang() {
      const t = TEXT[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = t[el.dataset.i18n]));
      document.getElementById('lang-btn').textContent = t.other;
      if (started) set_labels(t.date3d, t.time3d, t.zoomIn, t.zoomOut);
    }
    document.getElementById('lang-btn').addEventListener('click', () => {
      lang = lang === 'ko' ? 'en' : 'ko';
      store.set('lang', lang);
      applyLang();
    });
    applyLang();

    init({ module_or_path: WASM_URL }).then(() => {
      started = true;
      applyLang();
    }).catch((e) => {
      const t = TEXT[lang];
      const el = document.getElementById('error');
      el.textContent = t.fail + e + (String(e).includes('__wbindgen_placeholder__') ? ' — ' + t.stale : '');
      el.style.display = 'block';
      console.error(e);
    });
  </script>
</body>
</html>
