<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Earth Monitor</title>
  <meta name="description" content="3D 통합 지구/우주 환경 실시간 모니터링 — Three.js + Rust WebAssembly">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
  </script>
</head>
<body>
  <canvas id="scene" data-i18n-aria="globe" aria-label="3D 지구"></canvas>

  <div id="boot" class="boot">
    <div class="spinner big"></div>
    <p id="bootMsg">WASM 모듈과 텍스처를 불러오는 중…</p>
  </div>

  <button id="panelToggle" class="panel-toggle" aria-controls="panel" aria-expanded="true" data-i18n-title="panelBtn" title="레이어 패널">☰</button>

  <aside id="panel" class="panel" data-i18n-aria="panel" aria-label="레이어 제어">
    <header class="panel-head">
      <h1>🌍 Earth Monitor <small>v2.0</small><button id="langBtn" class="lang-btn" type="button" title="한국어 / English" data-i18n="langBtn">English</button></h1>
      <div class="clock">
        <span id="simTime">—</span>
        <div class="clock-ctl">
          <select id="speed" data-i18n-aria="speed" aria-label="시뮬레이션 배속">
            <option value="1" data-i18n="realtime">실시간 ×1</option>
            <option value="10">×10</option>
            <option value="60" data-i18n="perMin">×60 (1분/초)</option>
            <option value="600">×600</option>
            <option value="3600" data-i18n="perHour">×3600 (1시간/초)</option>
          </select>
          <button id="nowBtn" data-i18n="now" data-i18n-title="nowTitle" title="현재 시각으로">지금</button>
        </div>
      </div>
    </header>

    <section class="group">
      <h2 data-i18n="gLocation">위치</h2>
      <label class="row"><input type="checkbox" data-layer="pin" checked><span class="sw"></span><span class="name" data-i18n="myLocation">내 위치</span><span class="st" data-status="pin"></span></label>
    </section>

    <section class="group">
      <h2 data-i18n="gWeather">기상 · 대기</h2>
      <label class="row"><input type="checkbox" data-layer="clouds" checked><span class="sw"></span><span class="name" data-i18n="clouds">구름</span><span class="st" data-status="clouds"></span></label>
      <label class="row"><input type="checkbox" data-layer="air"><span class="sw"></span><span class="name" data-i18n="air">대기오염 (AQI)</span><span class="st" data-status="air"></span></label>
      <label class="row"><input type="checkbox" data-layer="aurora" checked><span class="sw"></span><span class="name" data-i18n="aurora">오로라</span><span class="st" data-status="aurora"></span></label>
    </section>

    <section class="group">
      <h2 data-i18n="gClimate">기후 위기 · 환경 한계선</h2>
      <label class="row"><input type="checkbox" data-layer="sst"><span class="sw"></span><span class="name" data-i18n="sst">해수면 온도 이상</span><span class="st" data-status="sst"></span></label>
      <label class="row"><input type="checkbox" data-layer="fires"><span class="sw"></span><span class="name" data-i18n="fires">실시간 산불</span><span class="st" data-status="fires"></span></label>
      <label class="row"><input type="checkbox" data-layer="ice"><span class="sw"></span><span class="name" data-i18n="ice">해빙 면적</span><span class="st" data-status="ice"></span></label>
      <label class="row"><input type="checkbox" data-layer="night" checked><span class="sw"></span><span class="name" data-i18n="night">야간 불빛</span><span class="st" data-status="night"></span></label>
    </section>

    <section class="group">
      <h2 data-i18n="gSpace">우주 환경</h2>
      <label class="row"><input type="checkbox" data-layer="leo" checked><span class="sw"></span><span class="dot leo"></span><span class="name"><span data-i18n="leo">LEO 파편</span> <em data-count="0"></em></span></label>
      <label class="row"><input type="checkbox" data-layer="meo" checked><span class="sw"></span><span class="dot meo"></span><span class="name"><span data-i18n="meo">MEO 파편</span> <em data-count="1"></em></span></label>
      <label class="row"><input type="checkbox" data-layer="geo" checked><span class="sw"></span><span class="dot geo"></span><span class="name"><span data-i18n="geo">GEO 파편</span> <em data-count="2"></em></span></label>
      <label class="row"><input type="checkbox" data-layer="sats" checked><span class="sw"></span><span class="dot sat"></span><span class="name"><span data-i18n="sats">인공위성</span> <em data-count="3"></em></span><span class="st" data-status="tle"></span></label>
      <label class="row"><input type="checkbox" data-layer="neo"><span class="sw"></span><span class="dot neo"></span><span class="name" data-i18n="neo">지구 근접 천체</span><span class="st" data-status="neo"></span></label>
    </section>

    <details class="group" id="legendBox">
      <summary data-i18n="legend">범례 · 상세</summary>
      <div id="details" class="details"></div>
    </details>

    <details class="group">
      <summary data-i18n="settings">설정 · API 키</summary>
      <form id="settings" class="settings" autocomplete="off">
        <label><span data-i18n="kOwm">OpenWeatherMap 키 (구름)</span><input name="owmKey" type="password" data-i18n-ph="optional" placeholder="선택"></label>
        <label><span data-i18n="kWaqi">WAQI 토큰 (대기질)</span><input name="waqiToken" type="password" data-i18n-ph="optWaqi" placeholder="선택 · 없으면 CAMS"></label>
        <label><span data-i18n="kFirms">NASA FIRMS MAP_KEY (산불)</span><input name="firmsKey" type="password" data-i18n-ph="optional" placeholder="선택"></label>
        <label><span data-i18n="kNasa">NASA API 키 (NEO)</span><input name="nasaKey" type="password" placeholder="DEMO_KEY"></label>
        <label><span data-i18n="kTle">TLE URL (Space-Track 프록시 등)</span><input name="tleUrl" type="url" data-i18n-ph="defTle" placeholder="기본: CelesTrak"></label>
        <label><span data-i18n="kWs">WebSocket URL</span><input name="wsUrl" type="url" data-i18n-ph="defWs" placeholder="기본: 백엔드 /ws"></label>
        <label><span data-i18n="kDebris">합성 파편 수</span> <output id="debrisOut"></output><input name="debris" type="range" min="0" max="60000" step="1000"></label>
        <div class="btns"><button type="submit" data-i18n="save">저장 후 다시 불러오기</button></div>
        <p class="hint" data-i18n="keyHint">키는 이 브라우저(localStorage)에만 저장됩니다. 백엔드(code/server/server.mjs)를 쓰면 키를 서버 환경변수로 둘 수 있습니다.</p>
      </form>
    </details>

    <footer class="hud" id="hud"></footer>
  </aside>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="pinLabel" class="pin-label" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
