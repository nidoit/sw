[package]
name = "earth-wasm"
version = "0.1.0"
edition = "2021"
description = "3D Earth monitor core: SGP4 orbit propagation, TLE/JSON parsing, aurora & air-quality particle physics"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
